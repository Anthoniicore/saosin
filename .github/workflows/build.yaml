name: build

# Run manually and each time anything is pushed or a PR is made
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    name: "Build Saosin (Chimera fastload-rewrite base)"
    runs-on: ubuntu-24.04

    steps:
      - name: "Install deps"
        run: |-
          sudo apt-get update
          sudo apt-get install -y software-properties-common gnupg build-essential mingw-w64 cmake python3 p7zip-full git

      - name: "Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to generate a valid build number

      - name: "Compile"
        env:
          LDFLAGS: -fstack-protector
        run: |-
          # Make CMake toolchain file (32-bit MinGW for Halo CE)
          printf '%s\n' \
            'set(CMAKE_SYSTEM_NAME Windows)' \
            'set(TOOLCHAIN i686-w64-mingw32)' \
            'set(CMAKE_C_COMPILER ${TOOLCHAIN}-gcc-posix)' \
            'set(CMAKE_CXX_COMPILER ${TOOLCHAIN}-g++-posix)' \
            'set(CMAKE_RC_COMPILER ${TOOLCHAIN}-windres)' \
            'set(CMAKE_AR ${TOOLCHAIN}-gcc-ar-posix)' \
            'set(CMAKE_RANLIB ${TOOLCHAIN}-gcc-ranlib-posix)' \
            'set(CMAKE_FIND_ROOT_PATH /usr/${TOOLCHAIN})' \
            'set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)' \
            'set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)' \
            'set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)' \
            'set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)' \
          > toolchain.cmake

          cmake . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX=build

          # Only build the game DLL (and its deps). Skip hac_map_downloader_test.
          cmake --build build -j "$(nproc)" --target monolith

      - name: "Strip symbols"
        if: "startsWith(github.ref, 'refs/tags/')"
        run: |-
          i686-w64-mingw32-strip ./build/strings.dll

      - name: "Package"
        id: package
        run: |-
          7z a -mx=9 saosin.7z LICENSE README.md chimera.ini fonts ./build/strings.dll

          echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "SHA=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: "Upload artifact"
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: saosin-${{ steps.package.outputs.SHA }}
          path: ./saosin.7z
